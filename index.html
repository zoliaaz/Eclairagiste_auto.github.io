<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Calculateur de disposition de spots</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f5f5f5;
    }
    h2 { margin-top: 30px; }
    .container {
        display: flex;
        gap: 40px;
    }
    #canvasContainer {
        background: white;
        padding: 10px;
        border: 1px solid #ccc;
    }
    canvas {
        background: #fafafa;
        border: 1px solid #aaa;
    }
    input {
        padding: 5px;
        margin: 5px 0;
        width: 120px;
    }
    #resultsContainer {
        margin-top: 20px;
        padding: 10px;
        background: #fff;
        border: 1px solid #ccc;
    }
</style>
</head>
<body>

<h1>Calculateur de disposition de spots</h1>

<div class="container">
    <div>

        <h2>Mode de disposition</h2>
        <select id="mode">
            <option value="centered">Espacement identique (centré)</option>
            <option value="edge">Écartement E/2 du mur</option>
        </select>

        <h2>Paramètres de la pièce</h2>
        Mur A (m) : <input id="width" type="number" step="0.01" value="5"><br>
        Mur B (m) : <input id="length" type="number" step="0.01" value="4"><br>
        Hauteur (m) : <input id="height" type="number" step="0.01" value="2.5"><br>

        <h2>Paramètres des spots</h2>
        Nombre de spots : <input id="spots" type="number" value="6"><br>
        Angle de diffusion (°) : <input id="angle" type="number" value="60"><br>
        Flux lumineux d’un spot (lm) : <input id="lumens" type="number" value="500"><br>
        Nombre de ligne :
        <select id="userRows">
            <option value="auto">Automatique</option>
            <option value="1">1 ligne</option>
            <option value="2">2 lignes</option>
            <option value="3">3 lignes</option>
        </select>
        <button onclick="calculate()">Calculer</button>

        <h2>Éclairement</h2>
        Lux souhaités : <input id="targetLux" type="number" placeholder="ex: 200"><br>
        <button onclick="calculateSpots()">Calculer le nombre de spots</button>

    </div>

    <div id="canvasContainer">
        <h2>Visualisation</h2>
        <canvas id="canvas" width="500" height="400"></canvas>
        <div id="resultsContainer">
            <h2>Résultats</h2>
            <div id="results"></div>
        </div>
    </div>
</div>

<script>

// --- VARIABLES GLOBALES POUR LE SURVOL ---
let lastWidth, lastLength, lastSpots, lastRadius, lastSpacingX, lastSpacingY, lastOffsetX, lastOffsetY;
let lastScale, lastOffsetXCanvas, lastOffsetYCanvas;
let hoveredSpot = null;

// --- Fonction de dessin d'une vraie cote ---
function drawDimensionLine(ctx, x1, y1, x2, y2, text, spotRadiusPx = 5) {
    ctx.save();
    ctx.strokeStyle = "red";
    ctx.fillStyle = "red";
    ctx.lineWidth = 1;

    const dx = x2 - x1;
    const dy = y2 - y1;
    const len = Math.sqrt(dx*dx + dy*dy);

    const ux = dx / len;
    const uy = dy / len;

    const ax = x1 + ux * spotRadiusPx;
    const ay = y1 + uy * spotRadiusPx;
    const bx = x2 - ux * spotRadiusPx;
    const by = y2 - uy * spotRadiusPx;

    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.stroke();

    function arrow(px, py, tx, ty) {
        const angle = Math.atan2(ty - py, tx - px);
        const size = 8;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + Math.cos(angle + Math.PI/6) * size,
                   py + Math.sin(angle + Math.PI/6) * size);
        ctx.lineTo(px + Math.cos(angle - Math.PI/6) * size,
                   py + Math.sin(angle - Math.PI/6) * size);
        ctx.closePath();
        ctx.fill();
    }

    arrow(ax, ay, bx, by);
    arrow(bx, by, ax, ay);

    ctx.font = "12px Arial";

    if (Math.abs(dy) < 1e-3) {
        ctx.fillText(text, (ax + bx) / 2 - 10, ay - 8);
    } else {
        ctx.fillText(text, ax - 45, (ay + by) / 2 + 4);
    }

    ctx.restore();
}

function calculate() {
    const width = parseFloat(document.getElementById("width").value);
    const length = parseFloat(document.getElementById("length").value);
    const height = parseFloat(document.getElementById("height").value);
    const n = parseInt(document.getElementById("spots").value);
    const angle = parseFloat(document.getElementById("angle").value);
    const lumens = parseFloat(document.getElementById("lumens").value);
    const mode = document.getElementById("mode").value;
    const userRows = document.getElementById("userRows").value;

    const totalLumens = n * lumens;
    const radius = Math.tan((angle / 2) * Math.PI / 180) * height;
    const area = width * length;
    const lux = totalLumens / area;

    let cols = Math.ceil(Math.sqrt(n));
    let rows = Math.ceil(n / cols);

    if (userRows === "auto") {
        if (n % 2 === 1) {
            rows = 1;
            cols = n;
        }
    }
    if (userRows === "1") { rows = 1; cols = n; }
    if (userRows === "2") { rows = 2; cols = Math.ceil(n / 2); }
    if (userRows === "3") { rows = 3; cols = Math.ceil(n / 3); }

    if (length > width) {
        const t = cols;
        cols = rows;
        rows = t;
    }

    let spacingX, spacingY, offsetX, offsetY;

    if (mode === "centered") {
        spacingX = width / (cols + 1);
        spacingY = length / (rows + 1);
        offsetX = spacingX;
        offsetY = spacingY;
    } else {
        spacingX = width / cols;
        spacingY = length / rows;
        offsetX = spacingX / 2;
        offsetY = spacingY / 2;
    }

    const positions = [];
    let index = 0;

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            if (index >= n) break;
            positions.push({
                x: offsetX + c * spacingX,
                y: offsetY + r * spacingY
            });
            index++;
        }
    }

    // Stockage global
    lastWidth = width;
    lastLength = length;
    lastSpots = positions;
    lastRadius = radius;
    lastSpacingX = spacingX;
    lastSpacingY = spacingY;
    lastOffsetX = offsetX;
    lastOffsetY = offsetY;

    draw(width, length, positions, radius, spacingX, spacingY, offsetX, offsetY);

    document.getElementById("results").innerHTML = `
        <p><b>Surface :</b> ${area.toFixed(2)} m²</p>
        <p><b>Flux lumineux total :</b> ${totalLumens} lm</p>
        <p><b>Rayon de la zone éclairée :</b> ${radius.toFixed(2)} m</p>
        <p><b>Éclairement obtenu :</b> ${lux.toFixed(1)} lux</p>
    `;
}

function calculateSpots() {
    const width = parseFloat(document.getElementById("width").value);
    const length = parseFloat(document.getElementById("length").value);
    const lumens = parseFloat(document.getElementById("lumens").value);
    const targetLux = parseFloat(document.getElementById("targetLux").value);

    const area = width * length;
    const neededSpots = Math.ceil((targetLux * area) / lumens);

    document.getElementById("results").innerHTML = `
        <p><b>Surface :</b> ${area.toFixed(2)} m²</p>
        <p><b>Nombre de spots nécessaires :</b> ${neededSpots}</p>
    `;
}

function draw(width, length, spots, radius, spacingX, spacingY, offsetX, offsetY, hoveredSpot = null) {
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const scale = Math.min(canvas.width / width, canvas.height / length);
    const offsetXCanvas = (canvas.width - width * scale) / 2;
    const offsetYCanvas = (canvas.height - length * scale) / 2;

    // Stockage global
    lastScale = scale;
    lastOffsetXCanvas = offsetXCanvas;
    lastOffsetYCanvas = offsetYCanvas;

    ctx.strokeStyle = "#000";
    ctx.strokeRect(offsetXCanvas, offsetYCanvas, width * scale, length * scale);

    // Dessin des zones d'éclairement
    ctx.globalCompositeOperation = "multiply";

    spots.forEach(s => {
        const x = offsetXCanvas + s.x * scale;
        const y = offsetYCanvas + s.y * scale;

        ctx.beginPath();
        ctx.fillStyle = "rgba(255,165,0,0.25)";
        ctx.arc(x, y, radius * scale, 0, Math.PI * 2);
        ctx.fill();
    });
	
// --- Highlight du cercle du spot survolé ---
if (hoveredSpot) {
    const hx = offsetXCanvas + hoveredSpot.x * scale;
    const hy = offsetYCanvas + hoveredSpot.y * scale;

    // Aura externe (glow)
   // ctx.beginPath();
    //ctx.strokeStyle = "rgba(255, 255, 0, 0.8)";
   //ctx.lineWidth = 6;
   //ctx.shadowColor = "rgba(255, 255, 0, 0.9)";
   //ctx.shadowBlur = 15;
   //ctx.arc(hx, hy, radius * scale, 0, Math.PI * 2);
   //ctx.stroke();

    // Contour interne plus fin
    ctx.beginPath();
    ctx.strokeStyle = "orange";
    ctx.lineWidth = 2;
    ctx.shadowBlur = 0;
    ctx.arc(hx, hy, radius * scale, 0, Math.PI * 2);
    ctx.stroke();
}

    ctx.globalCompositeOperation = "source-over";

    // Dessin des spots
    spots.forEach(s => {
        const x = offsetXCanvas + s.x * scale;
        const y = offsetYCanvas + s.y * scale;

        ctx.beginPath();
        ctx.fillStyle = (hoveredSpot === s) ? "red" : "black";
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
    });

    if (!spots.length) return;

    const first = spots[0];
    const x1 = offsetXCanvas + first.x * scale;
    const y1 = offsetYCanvas + first.y * scale;

    drawDimensionLine(ctx, offsetXCanvas, y1, x1, y1, offsetX.toFixed(2) + " m");
    drawDimensionLine(ctx, x1, offsetYCanvas, x1, y1, offsetY.toFixed(2) + " m");

    const sameRow = spots.filter(p => Math.abs(p.y - first.y) < 1e-3);
    if (sameRow.length > 1) {
        const s2 = sameRow[1];
        const x2 = offsetXCanvas + s2.x * scale;
        drawDimensionLine(ctx, x1, y1, x2, y1, spacingX.toFixed(2) + " m");
    }

    const row1 = spots.filter(p => Math.abs(p.y - first.y) < 1e-3);
    const row2 = spots.filter(p => Math.abs(p.y - first.y) > 1e-3);

    if (row1.length && row2.length) {
        const p1 = row1[0];
        const p2 = row2[0];
        const yA = offsetYCanvas + p1.y * scale;
        const yB = offsetYCanvas + p2.y * scale;
        drawDimensionLine(ctx, x1, yA, x1, yB, spacingY.toFixed(2) + " m");
    }
}

// --- SURVOL GLOBAL (UN SEUL LISTENER) ---
document.getElementById("canvas").addEventListener("mousemove", function(e) {
    if (!lastSpots) return;

    const rect = this.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    hoveredSpot = null;

    lastSpots.forEach(s => {
        const x = lastOffsetXCanvas + s.x * lastScale;
        const y = lastOffsetYCanvas + s.y * lastScale;

        const dist = Math.sqrt((mouseX - x)**2 + (mouseY - y)**2);

        if (dist < lastRadius * lastScale) {
            hoveredSpot = s;
        }
    });

    draw(lastWidth, lastLength, lastSpots, lastRadius, lastSpacingX, lastSpacingY, lastOffsetX, lastOffsetY, hoveredSpot);
});

</script>

</body>
</html>
